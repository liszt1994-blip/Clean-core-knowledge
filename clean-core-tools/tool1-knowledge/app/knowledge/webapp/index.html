<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Core Knowledge</title>
  <style>
    html, body, #content { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    /* Shell fills viewport */
    #__shell0, .sapMShell { height: 100% !important; }
    .sapMShellContent, .sapMShellCentralBox { height: 100% !important; }
    /* ComponentContainer and UIArea fill shell */
    .sapUiComponentContainer, [id$="-uiarea"] { height: 100% !important; }
    /* XML View and Page fill their container */
    .sapUiView, .sapUiXMLView { height: 100% !important; }
    .sapMPage { height: 100% !important; position: relative !important; }
    /* Page content section fills remaining space below header (44px) */
    .sapMPage > section {
      position: absolute !important;
      top: 2.75rem !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: auto !important;
      overflow: hidden !important;
    }
    /* TextArea fills its native wrapper */
    #ccTextAreaWrap .sapMTextArea,
    #ccTextAreaWrap .sapMTextAreaInner { width: 100% !important; box-sizing: border-box !important; }
  </style>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"knowledge": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow">
  </script>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.require(["sap/m/Shell", "sap/ui/core/ComponentContainer"], function (Shell, ComponentContainer) {
        new Shell({
          app: new ComponentContainer({
            name: "knowledge",
            settings: { id: "knowledge" },
            manifest: true,
            async: true,
            height: "100%"
          }),
          appWidthLimited: false
        }).placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
