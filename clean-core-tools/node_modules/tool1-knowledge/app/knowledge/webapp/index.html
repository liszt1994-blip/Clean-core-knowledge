<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clean Core Knowledge</title>
  <script id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"knowledge": "./"}'
    data-sap-ui-compatVersion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameOptions="allow">
  </script>
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.require(["sap/m/Shell", "sap/ui/core/ComponentContainer"], function (Shell, ComponentContainer) {
        new Shell({
          app: new ComponentContainer({
            name: "knowledge",
            settings: { id: "knowledge" },
            manifest: true,
            async: true,
            height: "100%"
          }),
          appWidthLimited: false
        }).placeAt("content");
      });
    });
  </script>
</head>
<body class="sapUiBody" id="content">
</body>
</html>
